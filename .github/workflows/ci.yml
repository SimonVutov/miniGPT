name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python data.py --input examples/tiny.txt --output runs/tiny-data
      - run: python main.py train --data runs/tiny-data --output runs/smoke --steps 3 --block-size 16 --embedding 16 --heads 2 --layers 1 --batch-size 2 --device cpu
      - run: python main.py generate --checkpoint runs/smoke/last.pt --prompt The --tokens 16
